# Сборка и выкладка на GitHub Pages при каждом изменении ветки main.
# Перед выкладкой запускаются проверки: если тесты не прошли, сайт не обновится.
name: Выкладка на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверки (типы, линтер, тесты)
        run: npm run check

      - name: Проверка уязвимостей
        run: npm audit --audit-level=high

      - id: pages
        uses: actions/configure-pages@v6

      - name: Проверка настройки ИИ-наставника
        env:
          MENTOR_URL: ${{ vars.AI_MENTOR_URL || secrets.AI_MENTOR_URL }}
        run: |
          url="$(echo "$MENTOR_URL" | tr -d '[:space:]"'"'"'')"
          if [ -z "$url" ]; then
            echo "::warning title=ИИ-наставник НЕ подключён::Не найден AI_MENTOR_URL (Settings → Secrets and variables → Actions → Variables). Сайт соберётся без наставника."
          elif [ "${url#https://}" = "$url" ]; then
            echo "::warning title=ИИ-наставник НЕ подключён::AI_MENTOR_URL должен начинаться с https://"
          else
            echo "::notice title=ИИ-наставник подключён::Адрес наставника найден, кнопка «Спросить наставника» будет на сайте."
          fi

      - name: Статическая сборка
        run: npx next build
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Адрес функции ИИ-наставника (Settings → Secrets and variables → Actions → Variables).
          # Это не секрет: браузер всё равно обращается по нему. Если не задан — наставник скрыт.
          # Берём из Variables, а если его положили в Secrets — оттуда.
          NEXT_PUBLIC_AI_MENTOR_URL: ${{ vars.AI_MENTOR_URL || secrets.AI_MENTOR_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
